
<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cor&Tom | Loja de Tintas</title>
</head>

<body>

    <!-- Cabeçalho da loja -->
    <header>

        <!-- Logo e nome -->
        <a href="index.html">
            <img src="imagens/logo.png" alt="Logo da Cor&T om">
        </a>

        <h1>Cor&T om</h1>

        <!-- Campo de pesquisa -->
        <form action="#" method="get">
            <label for="pesquisa">Pesquisar produtos:</label>

            <input
                type="search"
                id="pesquisa"
                name="q"
                placeholder="Digite o nome do produto"
            >

            <button type="submit">Pesquisar</button>
        </form>

        <!-- Menu de navegação -->
        <nav aria-label="Menu principal">
            <ul>
                <li><a href="index.html">Início</a></li>
                <li><a href="#produtos">Produtos</a></li>
                <li><a href="#categorias">Categorias</a></li>
                <li><a href="#contato">Contato</a></li>
            </ul>
        </nav>

    </header>

</body>

</html>
